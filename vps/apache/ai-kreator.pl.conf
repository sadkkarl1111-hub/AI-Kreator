<VirtualHost *:80>
    ServerName ai-kreator.pl
    ServerAlias www.ai-kreator.pl

    RewriteEngine On
    RewriteRule ^ https://ai-kreator.pl%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/ai-kreator-error.log
    CustomLog ${APACHE_LOG_DIR}/ai-kreator-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName ai-kreator.pl
    ServerAlias www.ai-kreator.pl

    DocumentRoot /var/www/ai-kreator.pl
    DirectoryIndex index.html

    <Directory /var/www/ai-kreator.pl>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 600
    ProxyPass /api/ http://127.0.0.1:3101/ timeout=600
    ProxyPassReverse /api/ http://127.0.0.1:3101/

    SSLEngine On
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/ai-kreator.pl/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ai-kreator.pl/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    <FilesMatch "\.(?:js|css|webp|png|jpe?g|gif|svg|ico|wasm|mjs)$">
        Header set Cache-Control "public, max-age=2592000, immutable"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/ai-kreator-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ai-kreator-ssl-access.log combined
</VirtualHost>
